name: CI
on:
  pull_request:
  push:
    branches: [master, infra/public-benchmarks]
permissions:
  contents: read
jobs:
  software-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install -e './benchmarks[dev]'
      - run: ruff format --check benchmarks
      - run: ruff check benchmarks
      - run: mypy --config-file benchmarks/pyproject.toml benchmarks/src
      - name: Synthetic software tests only
        run: pytest benchmarks/tests/synthetic
      - name: Validate JSON schemas
        run: python -c "import json; from pathlib import Path; from jsonschema.validators import validator_for; [validator_for(s:=json.loads(p.read_text())).check_schema(s) for p in Path('benchmarks/schemas').glob('*.json')]"
      - run: az bicep build --file infra/bicep/main.bicep
      - name: Build image without benchmark execution
        run: docker build --build-arg VCS_REF="$GITHUB_SHA" -t mcift-benchmarks:ci benchmarks
