name: Run Exathlon public benchmark
on:
  workflow_dispatch:
    inputs:
      confirmation: {description: 'Type RUN_EXATHLON_PUBLIC_BENCHMARK', required: true}
      image_digest: {description: 'Immutable ghcr.io image@sha256:...', required: true}
      dataset_uri: {description: 'Azure ML URI under datasets/exathlon/', required: true}
      output_run_id: {description: 'New run identifier', required: true}
permissions:
  id-token: write
  contents: read
jobs:
  submit:
    if: inputs.confirmation == 'RUN_EXATHLON_PUBLIC_BENCHMARK'
    environment: azure-benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Display immutable selections
        env:
          IMAGE: ${{ inputs.image_digest }}
          DATASET: ${{ inputs.dataset_uri }}
          RUN_ID: ${{ inputs.output_run_id }}
        run: |
          test "$DATASET" != "${DATASET#*datasets/exathlon/}"
          test "$IMAGE" != "${IMAGE#*@sha256:}"
          sha256sum benchmarks/configs/exathlon-19-v1.yaml
          printf 'image=%s\ndataset=%s\nrun=%s\n' "$IMAGE" "$DATASET" "$RUN_ID"
      - name: Submit AML command job
        run: >-
          az ml job create --resource-group '${{ vars.AZURE_RESOURCE_GROUP }}'
          --workspace-name '${{ vars.AZURE_ML_WORKSPACE }}' --file benchmarks/jobs/exathlon.yml
          --set environment.image='${{ inputs.image_digest }}'
          inputs.dataset_uri='${{ inputs.dataset_uri }}'
          outputs.run_uri="azureml://datastores/workspaceblobstore/paths/runs/exathlon/${{ inputs.output_run_id }}/"
