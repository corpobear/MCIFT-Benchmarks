name: Build benchmark image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: benchmarks
          platforms: linux/amd64
          push: true
          tags: ghcr.io/corpobear/mcift-benchmarks:sha-${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
          sbom: true
          provenance: mode=max
      - name: Record immutable digest
        run: echo 'Image digest ${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"

