[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mcift-benchmarks"
version = "0.1.0"
description = "Reproducible scaffolding for proposed MCIFT public benchmarks"
requires-python = ">=3.11,<3.14"
license = {text = "AGPL-3.0-only"}
dependencies = [
  "azure-identity==1.19.0",
  "azure-storage-blob==12.24.0",
  "jsonschema==4.23.0",
  "numpy==2.2.1",
  "matplotlib==3.10.0",
  "packaging==24.2",
  "psutil==6.1.1",
  "PyYAML==6.0.2",
  "scipy==1.15.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.14.1",
  "pytest==8.3.4",
  "ruff==0.9.2",
  "types-jsonschema==4.23.0.20241208",
  "types-PyYAML==6.0.12.20241230",
]

[project.scripts]
mcift-benchmarks = "mcift_benchmarks.cli:main"
mcift-ims-benchmark = "mcift_benchmarks.ims:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcift_benchmarks"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["scipy.*", "psutil"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/synthetic"]
addopts = "-q"
